<title>خطتي الأسبوعية</title>
<style>
:root{--bg:#fdf2f6;--sf:#fff;--tx:#3a1a2a;--mu:#8a6577;--ac:#d6336c;--ac2:#f0689a;--ln:#f3d3e0;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1218;--sf:#2b1a23;--tx:#fbe9f1;--mu:#c9a0b4;--ac:#f472a8;--ac2:#ff9fc0;--ln:#4a2b3a;--on:#2a0f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1218;--sf:#2b1a23;--tx:#fbe9f1;--mu:#c9a0b4;--ac:#f472a8;--ac2:#ff9fc0;--ln:#4a2b3a;--on:#2a0f1c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.7;font-size:16px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 2px;font-weight:800}
h2{font-size:1.15rem;margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 14px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.nav{background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:6px 12px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 auto;min-width:74px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:8px 6px;text-align:center}
.day small{display:block;color:var(--mu)}
.day[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.day[aria-pressed="true"] small{color:var(--on)}
.day.today{outline:2px solid var(--ac2);outline-offset:1px}
.tot{display:flex;gap:10px;margin:14px 0}
.tot div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.tot b{display:block;font-size:1.6rem;line-height:1.2}
.tot span{color:var(--mu);font-size:.9rem}
.tot .in b{color:var(--ac)}.tot .out b{color:var(--ac2)}
.row{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row p{margin:0}.row .t{color:var(--mu);font-size:.88rem}
.k{white-space:nowrap;font-weight:700}
a.vid{display:inline-block;margin-top:4px;color:var(--ac);font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}
.rest{background:var(--sf);border:1px dashed var(--ln);border-radius:14px;padding:14px;text-align:center;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.ls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ls a{font-size:.85rem;color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:1px 10px;text-decoration:none}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
</style>
</head>

<main>

</div>
<div class="days" id="days" role="group" aria-label="أيام الأسبوع"></div>

<div class="tot">
<div class="in"><b id="tin">0</b><span>سعرة من الأكل</span></div>
<div class="out"><b id="tout">0</b><span>سعرة تحرقها</span></div>
</div>
